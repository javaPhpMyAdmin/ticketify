<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ticketify</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Hanken Grotesk"', 'sans-serif'],
          },
          colors: {
            surface: {
              DEFAULT: '#ffffff',
              dim: '#f3f4f6',
              bright: '#ffffff',
              'container-lowest': '#ffffff',
              'container-low': '#f9fafb',
              container: '#f3f4f6',
              'container-high': '#e5e7eb',
              'container-highest': '#d1d5db',
            },
            primary: {
              DEFAULT: '#10b981',
              dim: '#ecfdf5',
              bright: '#34d399',
            },
            secondary: {
              DEFAULT: '#f43f5e',
            },
            on: {
              surface: '#111827',
              'surface-variant': '#4b5563',
              primary: '#ffffff',
              secondary: '#ffffff',
            },
            outline: '#d1d5db',
            'outline-variant': '#e5e7eb',
          },
          borderRadius: {
            DEFAULT: '0.5rem',
            'xl': '1rem',
            '2xl': '1.5rem',
            'full': '9999px',
          },
          boxShadow: {
            'glow-primary': '0 0 15px rgba(16, 185, 129, 0.3)',
            'glow-secondary': '0 0 15px rgba(244, 63, 94, 0.3)',
          }
        }
      }
    }
  </script>
<style data-purpose="layout">
    body {
      background-color: #ffffff;
      color: #111827;
      font-family: 'Hanken Grotesk', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .glass-card {
      background-color: rgba(249, 250, 251, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(209, 213, 219, 0.5);
    }
  </style>
</head>
<body class="bg-surface text-on-surface">
<!-- BEGIN: Main Header -->
<header class="px-6 pt-12 pb-6 flex justify-between items-center bg-surface sticky top-0 z-10">
<h1 class="text-2xl font-bold tracking-tight">Ticketify</h1>
<div class="flex items-center space-x-2 bg-surface-container px-3 py-1.5 rounded-full border border-outline-variant">
<span class="text-sm font-medium">Octubre</span>
<svg class="text-on-surface-variant" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"><polyline points="6 9 12 15 18 9"></polyline></svg>
</div>
</header>
<!-- END: Main Header -->
<!-- BEGIN: Main Content Area -->
<main class="flex-1 px-4 pb-24 space-y-6">
<!-- Insight Banner -->
<section class="glass-card rounded-2xl p-4 flex items-start gap-4 shadow-sm">
<div class="w-10 h-10 rounded-full bg-secondary bg-opacity-10 flex items-center justify-center shrink-0">
<svg class="text-secondary" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>
</div>
<div>
<p class="text-[15px] font-medium leading-snug">Gastaste <span class="text-primary font-bold">$108 menos</span> que el mes pasado. ¡Sigue así! 👋</p>
</div>
</section>
<!-- BEGIN: Weekly Bar Chart Section -->
<section class="glass-card rounded-3xl p-6 shadow-sm">
<!-- Header & Toggle -->
<div class="flex justify-between items-center mb-10">
<h2 class="text-lg font-semibold text-secondary">Esta semana</h2>
<div class="flex bg-surface-container-high rounded-full p-1 border border-outline-variant/30">
<button class="px-3 py-1 text-xs font-bold bg-surface text-on-surface rounded-full shadow-sm">W</button>
<button class="px-3 py-1 text-xs font-medium text-on-surface-variant hover:text-on-surface transition-colors">M</button>
<button class="px-3 py-1 text-xs font-medium text-on-surface-variant hover:text-on-surface transition-colors">Y</button>
</div>
</div>
<!-- Bar Chart -->
<div class="flex justify-between items-end h-48 mt-4">
<!-- Monday -->
<div class="flex flex-col items-center gap-3 w-10">
<span class="text-xs font-medium text-on-surface-variant">$42</span>
<div class="w-8 h-12 bg-surface-container-highest rounded-full"></div>
<span class="text-xs font-semibold text-on-surface-variant mt-2">L</span>
</div>
<!-- Tuesday -->
<div class="flex flex-col items-center gap-3 w-10">
<span class="text-xs font-medium text-on-surface-variant">$68</span>
<div class="w-8 h-20 bg-surface-container-highest rounded-full"></div>
<span class="text-xs font-semibold text-on-surface-variant mt-2">M</span>
</div>
<!-- Wednesday -->
<div class="flex flex-col items-center gap-3 w-10">
<span class="text-xs font-medium text-on-surface-variant">$30</span>
<div class="w-8 h-10 bg-surface-container-highest rounded-full"></div>
<span class="text-xs font-semibold text-on-surface-variant mt-2">X</span>
</div>
<!-- Thursday -->
<div class="flex flex-col items-center gap-3 w-10">
<span class="text-xs font-medium text-on-surface-variant">$88</span>
<div class="w-8 h-[100px] bg-surface-container-highest rounded-full"></div>
<span class="text-xs font-semibold text-on-surface-variant mt-2">J</span>
</div>
<!-- Friday -->
<div class="flex flex-col items-center gap-3 w-10">
<span class="text-xs font-medium text-on-surface-variant">$51</span>
<div class="w-8 h-14 bg-surface-container-highest rounded-full"></div>
<span class="text-xs font-semibold text-on-surface-variant mt-2">V</span>
</div>
<!-- Saturday (Active) -->
<div class="flex flex-col items-center gap-3 w-10">
<span class="text-xs font-bold text-secondary">$120</span>
<div class="w-8 h-32 bg-secondary rounded-full shadow-glow-secondary relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-t from-transparent to-white/20"></div>
</div>
<span class="text-xs font-bold text-on-surface mt-2">S</span>
</div>
<!-- Sunday -->
<div class="flex flex-col items-center gap-3 w-10">
<span class="text-xs font-medium text-on-surface-variant">$35</span>
<div class="w-8 h-10 bg-surface-container-highest rounded-full"></div>
<span class="text-xs font-semibold text-on-surface-variant mt-2">D</span>
</div>
</div>
</section>
<!-- END: Weekly Bar Chart Section -->
<!-- Placeholder for lower cards -->
<div class="grid grid-cols-2 gap-4 mt-2 opacity-50 pointer-events-none">
<div class="glass-card rounded-2xl p-5 h-32 flex flex-col justify-between shadow-sm">
<div class="w-8 h-8 rounded-full bg-secondary/10 flex items-center justify-center">
<svg class="text-secondary" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path><line x1="6" x2="6" y1="2" y2="4"></line><line x1="10" x2="10" y1="2" y2="4"></line><line x1="14" x2="14" y1="2" y2="4"></line></svg>
</div>
<p class="text-xs text-on-surface-variant font-medium">Categoría principal</p>
</div>
<div class="glass-card rounded-2xl p-5 h-32 flex flex-col justify-between shadow-sm">
<div class="w-8 h-8 rounded-full bg-indigo-500/10 flex items-center justify-center">
<svg class="text-indigo-500" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"><path d="m13 2-2 2.5h3L11 7"></path><path d="m11 22 2-2.5h-3L13 17"></path><path d="M2 13h2.5l-2-2H7"></path><path d="M22 11h-2.5l2 2H17"></path></svg>
</div>
<p class="text-xs text-on-surface-variant font-medium">Promedio diario</p>
</div>
</div>
</main>
<!-- END: Main Content Area -->
<!-- BEGIN: Bottom Navigation -->
<nav class="fixed bottom-0 w-full bg-surface-container-lowest/90 backdrop-blur-md border-t border-outline-variant/50 pb-safe pt-2 px-6 flex justify-between items-center z-20">
<a class="flex flex-col items-center p-2 text-on-surface-variant hover:text-on-surface transition-colors" href="#">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
<span class="text-[10px] mt-1 font-medium">Inicio</span>
</a>
<a class="flex flex-col items-center p-2 text-primary" href="#">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M3 3v18h18"></path><path d="m19 9-5 5-4-4-3 3"></path></svg>
<span class="text-[10px] mt-1 font-medium">Análisis</span>
</a>
<a class="flex flex-col items-center p-2 text-on-surface-variant hover:text-on-surface transition-colors" href="#">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><rect height="4" rx="1" width="4" x="3" y="3"></rect><rect height="4" rx="1" width="4" x="17" y="3"></rect><rect height="4" rx="1" width="4" x="17" y="17"></rect><rect height="4" rx="1" width="4" x="3" y="17"></rect><path d="M9 3h6"></path><path d="M9 21h6"></path><path d="M21 9v6"></path><path d="M3 9v6"></path><path d="M10 10h4v4h-4z"></path></svg>
<span class="text-[10px] mt-1 font-medium">Escanear</span>
</a>
<a class="flex flex-col items-center p-2 text-on-surface-variant hover:text-on-surface transition-colors" href="#">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg>
<span class="text-[10px] mt-1 font-medium">Historial</span>
</a>
<a class="flex flex-col items-center p-2 text-on-surface-variant hover:text-on-surface transition-colors" href="#">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
<span class="text-[10px] mt-1 font-medium">Perfil</span>
</a>
</nav>
<!-- END: Bottom Navigation -->
</body></html>
