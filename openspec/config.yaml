schema: spec-driven

context: |
  Tech stack: Expo SDK 54 (RN 0.81, React 19, newArch), expo-router 6 (typed routes), Zustand 5, TanStack Query 5, Supabase (JS 2.x client + CLI), i18next 26 (es-AR source of truth; pt-BR/en), expo-dev-client, TypeScript ~5.9 strict
  Architecture: Feature-first under src/ (expo-router routes, atomic components, feature modules with hooks/api, Zustand stores, theme tokens); EXPENSE_CATEGORIES taxonomy in src/features/home/categories.ts
  Testing: Custom Node ESM harnesses (scripts/test-*.mjs, tsc-compiled, node:assert/strict) chained via `pnpm test`; SQL smoke tests in supabase/tests/*.sql (CI db-smoke job); strict_tdd enabled
  Style: pnpm, ESLint 9 flat (eslint-config-expo), tsc --noEmit, @/* -> src/* path alias, component barrel index files, conventional commits

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns (atomic components, feature hooks, barrel files, @/ alias)
    tdd: true
    test_command: "pnpm test"
  verify:
    test_command: "pnpm test"
    build_command: "pnpm typecheck"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas