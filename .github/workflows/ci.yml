name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

  db-smoke:
    name: DB schema smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pin explicitly: setup-cli's lockfile detection does not parse
          # pnpm (fell back to 2.20.3 which lacks `db query --local`). Match
          # the local CLI used for development (has db query).
          version: 2.116.0

      - name: Authenticate to GHCR (avoid anonymous pull rate limits)
        # GHCR rate-limits ANONYMOUS pulls by runner egress IP
        # ("toomanyrequests: allowed: 44000/minute" on shared runner
        # IPs). Logging in with the GITHUB_TOKEN moves the pull from
        # the anonymous IP bucket to the authenticated account bucket,
        # which is not exhausted by other public repos sharing the IP.
        # Auth'd pulls of public packages (supabase/postgres) work with
        # any valid token regardless of image ownership.
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start local Supabase (Postgres only)
        # Starts the local stack on a fresh scratch DB and applies every
        # migration in supabase/migrations/, so the catalog reflects the
        # expected schema before the READ-ONLY smoke test runs. Non-DB
        # services are excluded: `supabase db query --local` connects
        # directly to Postgres via the wire protocol and never needs
        # studio/kong/gotrue/etc.
        #
        # GHCR rate-limits shared runner egress IPs under load
        # ("toomanyrequests: allowed: 44000/minute" pulling
        # ghcr.io/supabase/postgres). Retry with backoff: the pull is
        # resumable via docker layer cache, so a transient limit usually
        # clears on the next attempt.
        run: |
          for attempt in 1 2 3 4 5; do
            # `if out="$(...)"` (no `!`) keeps `set -e` from killing the
            # shell on the first failure, and `rc=$?` inside the ELSE
            # branch preserves the real exit code — a bare `!` negation
            # or a post-`fi` `$?` both reset to 0 and mask a real failure
            # as success (false green).
            if out="$(supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor 2>&1)"; then
              printf '%s\n' "$out"
              exit 0
            else
              rc=$?
              # Fail fast on anything that is NOT a transient registry limit:
              # an infra/rate-limit flake should retry, a real migration or
              # config error must surface immediately, not after 5 retries.
              if ! printf '%s\n' "$out" | grep -q "toomanyrequests"; then
                printf '%s\n' "$out"
                echo "::error::supabase start failed without a registry rate limit (rc=$rc)"
                exit "$rc"
              fi
              echo "::warning::supabase start hit a registry rate limit (attempt $attempt/5)"
              printf '%s\n' "$out"
              supabase stop --no-backup >/dev/null 2>&1 || true
              sleep "$((attempt * 20))"
            fi
          done
          echo "::error::supabase start failed after 5 retries"
          exit 1

      - name: Reset to a deterministic migration baseline
        # Guarantees a clean catalog from scratch regardless of container
        # caching between runs (fresh DB + all migrations replayed in order).
        run: supabase db reset --local

      - name: Run pro-subscription SQL smoke test
        # Executes the arbitrary .sql smoke test (DO/assert blocks, NOT
        # pgTAP) against the local catalog. Any raised assertion fails the
        # query and, because steps stop on error, the whole job.
        run: supabase db query --local --file supabase/tests/pro-subscription.sql

      - name: Run household-totals SQL smoke test
        # Pins the 0031 contract (confirmed-only household totals, net
        # reconcile personal == household, non-member zero rows, anon denied).
        run: supabase db query --local --file supabase/tests/household-totals.sql

      - name: Run user-categories SQL smoke test
        # Pins the 0032 contract (public + user categories, per-scope slug
        # uniqueness, global/own coexistence + sort floor, RLS write policies
        # incl. purchase_items category ownership, save_receipt server-side
        # category validation, FK RESTRICT backstop, anon denied last).
        run: supabase db query --local --file supabase/tests/user-categories.sql

      - name: Run recalculate-on-purchase-items-update SQL smoke test
        # Pins the 0033 contract: an UPDATE that re-points purchase_items
        # category_id (the reassign/delete picker seam) recalculates the
        # affected month server-side, so the materialized
        # monthly_user_totals cache reflects the move immediately.
        run: supabase db query --local --file supabase/tests/recalculate-on-purchase-items-update.sql

      - name: Run household-gate-tier SQL smoke test
        # Pins the 0034 security contract: create_household gates on the
        # server-authoritative tier ONLY (a free user with a spoofed
        # subscription_status='active' is rejected), trial access via
        # tier='pro' keeps working (no regression), sync_client_subscription
        # rejects the 'active' claim (webhook-only) and the remaining claims
        # never change tier; anon/public have no EXECUTE on either definer RPC.
        run: supabase db query --local --file supabase/tests/household-gate-tier.sql

      - name: Run trial-cutover SQL smoke test
        # Pins the 0039 contract (revenuecat-trial-migration slice A): the
        # narrowed subscription_status CHECK rejects 'trial'/'frozen'/
        # 'expired' (SQLSTATE 23514); start_free_trial and
        # expire_overdue_trials are DROPPED; trial_ends_at column is
        # DROPPED; cron.job 'trial-expiry' is UNSCHEDULED (best-effort);
        # sync_subscription_status rejects 'trial'/'expired' (allow-list
        # narrowed to 'none'/'active'); backfill-equivalent UPDATE
        # matches zero rows post-cutover (idempotency).
        # NOTE: the 0040 rollback migration + its paired smoke live in
        # supabase/manual/ (NOT auto-applied by `db reset` — they're
        # manual-only). See supabase/manual/0040_rc_trial_rollback.sql
        # for the <1h rollback runbook header.
        run: supabase db query --local --file supabase/tests/trial-cutover.sql

      - name: Run legal-acceptances SQL smoke test
        # Pins the 0038 contract (legal-compliance U1): append-only
        # legal_acceptances (RLS select/insert own only, zero update/delete
        # policies), the record_legal_acceptance SECURITY DEFINER RPC
        # (postgres owner, EXECUTE authenticated-only — anon/PUBLIC/
        # service_role revoked), idempotent duplicate (document, version)
        # writes, the document CHECK ('privacy'|'terms'), the auth.users
        # ON DELETE CASCADE, and anon denial.
        run: supabase db query --local --file supabase/tests/legal-acceptances.sql
